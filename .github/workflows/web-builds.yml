name: Build Windows Only
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Windows构建版本，留空优先tag，再pyproject.toml"
        required: false
        default: ""
  push:
    # branches: [ main ]
    tags: [ 'v*' ]
env:
  UV_PYTHON: "3.13"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
jobs:
  build_windows:
    name: Build Flet Windows → Zip Package
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies strict lock
        run: uv sync --locked

      - name: Resolve windows build version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.build_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          fi
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          # ✅只写入纯版本号，不带key前缀
          echo -n "$version" > .build_version.txt

      - name: Flet build windows
        shell: bash
        run: |
          set -euo pipefail
          uv run flet build windows --yes --verbose --build-version "${BUILD_VERSION}"

      - name: Compress windows output to zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat .build_version.txt)
          ZIP_NAME="flet-windows-v${VERSION}.zip"
          cd build/windows
          zip -r "../../${ZIP_NAME}" .
          cd -
          echo "ZIP_FILE=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload zip to Actions Artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-zip-artifact
          path: ${{ env.ZIP_FILE }}
          if-no-files-found: error

      - name: Attach windows‑zip to GitHub Release (Only tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_FILE }}
          generate_release_notes: true

      - name: Clean temp file
        shell: bash
        run: rm -f .build_version.txt
